<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="clear-day">
  <main class="app">

    <form id="search-form" class="search" autocomplete="off">
      <label for="city-input" class="sr-only">City name</label>
      <input id="city-input" type="search" placeholder="Search for a city" required>
      <button type="submit" class="btn-primary">Search</button>
      <button type="button" id="locate-btn" class="btn-icon" aria-label="Use my location" title="Use my location">📍</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="current" class="panel current" hidden>
      <div class="current-top">
        <div>
          <h1 id="place-name"></h1>
          <p id="place-region" class="muted"></p>
        </div>
        <div class="units" role="group" aria-label="Temperature unit">
          <button type="button" data-unit="celsius" aria-pressed="true">°C</button>
          <button type="button" data-unit="fahrenheit" aria-pressed="false">°F</button>
        </div>
      </div>

      <div class="reading">
        <span id="temp" class="temp"></span>
        <span id="icon" class="icon" aria-hidden="true"></span>
      </div>
      <p id="condition" class="condition"></p>

      <dl class="details">
        <div><dt>Feels like</dt><dd id="feels"></dd></div>
        <div><dt>Humidity</dt><dd id="humidity"></dd></div>
        <div><dt>Wind</dt><dd id="wind"></dd></div>
      </dl>
    </section>

    <section id="forecast" class="panel" hidden>
      <h2>7-day forecast</h2>
      <ul id="forecast-list" class="forecast-list"></ul>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
